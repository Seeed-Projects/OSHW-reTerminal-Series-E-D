[env:reterminal_e1001]
platform = https://github.com/platformio/platform-espressif32.git#87cbed0ab9e66a78e99a5ddfa19c6bf900a79bc7
board = reterminal
framework = arduino
build_src_filter =
	+<*>
	-<boards/reterminal_e1003/>
	-<boards/reterminal_e1004/>
	-<boards/xiao_diy/>
board_build.f_cpu = 240000000L
board_build.f_flash   = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_reterminal.csv
board_upload.offset_address = 0x90000
board_upload.flash_size = 32MB
upload_speed = 460800
build_flags = 
	-D BOARD_SEEED_RETERMINAL_E1001
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=5
	-D CONFIG_ESP_COREDUMP_ENABLE_FLASH=1
	-I $PROJECT_DIR/src

lib_ldf_mode = deep
lib_deps = 
    ${base_lib_deps.lib_deps}

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = ./littlefsbuilder.py


