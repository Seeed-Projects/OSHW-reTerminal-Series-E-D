[platformio]
default_envs = reterminal_e1001

[base_lib_deps]
lib_deps =
	https://github.com/adafruit/Adafruit_SHT4X.git#76a06edfa280a699da1c2f311bdeccb0bd5cee92
	https://github.com/Makuna/Rtc.git#7928697ff4a5e4ae55824c47b961aac0503720d9
	https://github.com/mathertel/OneButton.git#0cebe0c726cbb535941e49ccdc156443a8a7aaf1
	https://github.com/h2zero/NimBLE-Arduino#dffd290403064b443238630f59fd5282728ea824

	https://github.com/marian-craciunescu/ESP32Ping.git#357e5f5fc983092442921204b3cdefd89e624fe5
	https://github.com/Bodmer/U8g2_for_TFT_eSPI.git#a170ef8b6d8414b1ee2ecc97b5b913e08f5597ac
	https://github.com/Seeed-Studio/Seeed_GFX.git#24c5094cbde79933e93565ee68119e214c48fb36
	https://github.com/kikuchan/pngle.git#b1c68193f1d3f8642b3e0e095d457a828038e6fb
	https://github.com/QingWind6/OpenFontRender.git#67a3a22442cca183e2e2b763a19c961008a55035


[env:TRMNL_7inch5_OG_DIY_Kit]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_src_filter =
	+<*>
	-<boards/reterminal_e1001/>
	-<boards/reterminal_e1003/>
	-<boards/reterminal_e1004/>
board_build.f_cpu = 240000000L
board_build.f_flash   = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_diykit.csv
board_upload.offset_address = 0x90000
upload_speed = 460800
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=debug
	-I $PROJECT_DIR/src
	-D BOARD_XIAO_EPAPER_DISPLAY
lib_ldf_mode = deep
lib_deps = 
    ${base_lib_deps.lib_deps}

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = ./littlefsbuilder.py


[sensecraft_xiao_diy]
