build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=debug
	-I $PROJECT_DIR/src
lib_ldf_mode = deep
lib_deps = 
    ${base_lib_deps.lib_deps}

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = ./littlefsbuilder.py

