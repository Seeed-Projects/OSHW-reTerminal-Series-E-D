framework = arduino
build_src_filter =
	+<*>
	-<boards/reterminal_e1001/>
	-<boards/reterminal_e1003/>
	-<boards/reterminal_e1004/>
board_build.f_cpu = 240000000L
board_build.f_flash   = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_diykit_new.csv
board_upload.offset_address = 0x90000
board_upload.flash_size = 16MB
